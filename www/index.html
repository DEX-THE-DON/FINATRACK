<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finatrack Mobile</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #2563eb;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
        }
        h1 { margin: 0 0 8px; font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
        p { color: #94a3b8; font-size: 14px; margin: 0 0 24px; }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="logo">🛵</div>
    <h1>FINATRACK</h1>
    <p>Connecting to Finatrack fleet services...</p>
    <div class="spinner" id="spinner"></div>
    <div id="fallback" style="display: none;">
        <p style="color: #f87171;">Server offline or checking connection...</p>
        <button class="btn" onclick="retryConnection()">Retry Connection</button>
    </div>

    <script>
        const DEFAULT_URL = "http://10.0.2.2:8000/rider"; // standard Android emulator host IP
        const LAN_URL = localStorage.getItem('finatrack_server_url') || DEFAULT_URL;

        function connect() {
            // Attempt to load Finatrack dashboard
            fetch(LAN_URL, { mode: 'no-cors' })
                .then(() => {
                    window.location.href = LAN_URL;
                })
                .catch(() => {
                    // Fallback to local host if 10.0.2.2 fails
                    const altUrl = "http://localhost:8000/rider";
                    fetch(altUrl, { mode: 'no-cors' })
                        .then(() => window.location.href = altUrl)
                        .catch(() => {
                            document.getElementById('spinner').style.display = 'none';
                            document.getElementById('fallback').style.display = 'block';
                        });
                });
        }

        function retryConnection() {
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('fallback').style.display = 'none';
            connect();
        }

        // Connect immediately on load
        setTimeout(connect, 600);
    </script>
</body>
</html>
